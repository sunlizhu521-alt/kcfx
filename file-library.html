<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kcfx 维度表文件库</title>
  <link rel="stylesheet" href="styles.css?v=20260531d">
</head>
<body data-library-type="dimension">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>kcfx</strong>
        <span>关账后库存决策看板</span>
      </div>
      <nav class="nav">
        <a href="index.html">库存决策看板</a>
        <a href="fact-library.html">备货事实表库</a>
        <a class="active" href="file-library.html">维度表文件库</a>
        <a href="errors.html">报错信息提示</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h1>维度表文件库</h1>
          <p>上传商品分类、仓库分类、仓库物料事业部对照表。看板按物料编码与三元联合键匹配。</p>
        </div>
        <button id="applyAllBtn" class="secondary" type="button">一键全部应用刷新</button>
      </header>

      <section class="library-summary">
        <div class="summary-head">
          <div>
            <span id="libraryEyebrow" class="summary-eyebrow">DIMENSION FILES</span>
            <h2 id="libraryTitle">月度维度表文件库</h2>
          </div>
          <span id="savedBadge" class="saved-badge">维度文件已保存</span>
        </div>
        <div class="summary-metrics">
          <div><span>维度上限</span><strong id="slotLimit">0</strong></div>
          <div><span>已上传维度</span><strong id="uploadedCount">0</strong></div>
          <div><span>已应用维度</span><strong id="appliedCount">0</strong></div>
          <div><span>最近更新</span><strong id="latestUpdate">-</strong></div>
        </div>
        <div class="permission-row">
          <div class="permission-status">
            <span>替换权限</span>
            <strong id="permissionStatus">请输入验证秘钥后可替换已上传文件</strong>
          </div>
          <label>
            <span>验证秘钥</span>
            <input id="unlockInput" placeholder="请输入验证秘钥">
          </label>
          <button id="enableReplaceBtn" type="button">启用替换</button>
        </div>
        <div class="toolbar">
          <button id="refreshBtn" type="button">应用刷新</button>
          <button id="downloadSharedBtn" class="secondary" type="button">导出共享数据包</button>
          <span class="muted" id="sharedStatus">正在同步共享文件库...</span>
        </div>
      </section>

      <section id="libraryGrid" class="library-grid"></section>
    </main>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="storage.js?v=20260531d"></script>
  <script src="shared-library.js?v=20260531d"></script>
  <script src="library-page.js?v=20260531d"></script>
</body>
</html>
