  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>库存分析看板</strong>
        <span>供应链维护更新</span>
      </div>
      <nav class="nav">
        <a href="receipt-summary.html">供应链库存分析</a>

    <main class="content">
      <header class="topbar">
        <div>
          <h1>库存趋势变化</h1>
          <p id="summaryStatus" class="status-line">正在读取文件库...</p>
        </div>
      </header>

      <section class="trend-chart-grid">
        <div class="panel trend-panel">
          <h2>事业部数量趋势 <span id="departmentTrendTotal" class="chart-total"></span></h2>
          <div id="departmentTrendChart" class="vertical-trend-chart"></div>
        </div>
        <div class="panel trend-panel">
          <h2>各产品数量趋势 <span id="productTrendTotal" class="chart-total"></span></h2>
          <div id="productTrendChart" class="vertical-trend-chart"></div>
        </div>
        <div class="panel trend-panel">
          <h2>仓库位置数量趋势 <span id="warehouseLocationTrendTotal" class="chart-total"></span></h2>
          <div id="warehouseLocationTrendChart" class="vertical-trend-chart"></div>
        </div>
      </section>

      <div id="sourcePanel" class="data-source-panel"></div>
    </main>
  </div>

  <script src="storage.js?v=20260602g"></script>
