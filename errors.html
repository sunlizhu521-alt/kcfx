<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>库存分析看板 报错信息提示</title>
  <link rel="stylesheet" href="styles.css?v=20260531i">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>库存分析看板</strong>
        <span>供应链维护更新</span>
      </div>
      <nav class="nav">
        <a href="index.html">库存分析看板</a>
        <a href="fact-library.html">备货事实表库</a>
        <a href="file-library.html">维度表文件库</a>
        <a class="active" href="errors.html">报错信息提示</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h1>报错信息提示</h1>
          <p>根据关账后库存事实表中有库存数量的物料编码，检查核心维表是否缺失映射。</p>
        </div>
        <div class="status-pill" id="checkStatus">正在读取文件库...</div>
      </header>

      <section class="toolbar">
        <button id="refreshBtn" type="button">应用刷新</button>
        <button id="downloadAllBtn" class="secondary" type="button">一键下载</button>
      </section>

      <section class="metrics error-metrics">
        <div class="metric-card"><span>有库存物料数</span><strong id="stockMaterialCount">0</strong></div>
        <div class="metric-card"><span>商品分类缺失</span><strong id="productMissingCount">0</strong></div>
        <div class="metric-card"><span>事业部对照缺失</span><strong id="divisionMissingCount">0</strong></div>
        <div class="metric-card"><span>仓库对照缺失</span><strong id="warehouseMissingCount">0</strong></div>
        <div class="metric-card"><span>结算价缺失</span><strong id="settlementMissingCount">0</strong></div>
      </section>

      <section class="error-section">
        <div class="table-title">有库存商品维度表没有信息</div>
        <div class="table-panel">
          <table>
            <thead>
              <tr>
                <th>物料编码</th>
                <th>SKU</th>
                <th>物料名称</th>
                <th>数量</th>
              </tr>
            </thead>
            <tbody id="productMissingRows"></tbody>
          </table>
        </div>
      </section>

      <section class="error-section">
        <div class="table-title">有库存仓库物料事业部对照表没有信息</div>
        <div class="table-panel">
          <table>
            <thead>
              <tr>
                <th>物料编码</th>
                <th>SKU</th>
                <th>物料名称</th>
                <th>数量</th>
              </tr>
            </thead>
            <tbody id="divisionMissingRows"></tbody>
          </table>
        </div>
      </section>

      <section class="error-section">
        <div class="table-title">有库存仓库、金蝶、旺店通、领星没有信息</div>
        <div class="table-panel">
          <table>
            <thead>
              <tr>
                <th>仓库</th>
                <th>数量</th>
              </tr>
            </thead>
            <tbody id="warehouseMissingRows"></tbody>
          </table>
        </div>
      </section>

      <section class="error-section">
        <div class="table-title">有库存没有结算价（含税）的物料</div>
        <div class="table-panel">
          <table>
            <thead>
              <tr>
                <th>物料编码</th>
                <th>物料名称</th>
                <th>销售产品线</th>
                <th>数量</th>
              </tr>
            </thead>
            <tbody id="settlementMissingRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="storage.js?v=20260601a"></script>
  <script src="shared-library.js?v=20260601a"></script>
  <script src="errors.js?v=20260601c"></script>
</body>
</html>
